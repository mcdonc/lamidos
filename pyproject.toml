[project]
name = "lamidos"
version = "0.1.0"
description = "AmigaDOS-style shell emulator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "coverage[toml]",
  "pytest",
  "pytest-cov",
  "pytest-timeout",
  "pytest-testmon",
  "pytest-xdist",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lamidos/lamidos"]

[tool.pytest.ini_options]
# Coverage rides in addopts so the plain CI invocation (`python -m
# pytest src/lamidos/tests -v -n auto`) is the gated one; scoped
# runs pass --no-cov (see the `testmon` idiom in msks).
# The per-test ceiling: a suite that stalls at a test fails there,
# named, within seconds of the ceiling -- instead of a wall of dots
# ending in silence while the CI budget burns.
#
# --dist loadgroup: tests sharing an xdist_group marker run on one
# worker (unmarked tests distribute individually, exactly as under
# the default load mode). Inert without -n.
addopts = "--cov=lamidos --cov-branch --cov-report=term-missing -ra --timeout=60 --durations=10 --dist loadgroup"
testpaths = ["src/lamidos/tests"]

[tool.coverage.run]
branch = true
source = ["lamidos"]
# No `concurrency` option: the suite pins COVERAGE_CORE=sysmon in
# conftest.py (sys.monitoring on 3.14 measures branches natively);
# sysmon does not support concurrency.

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

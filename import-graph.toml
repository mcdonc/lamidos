# The import-graph gates' config (AGENTS.md, "Import-graph gates").
# Rule plus config: scripts/check_import_graph.py enforces these
# entries over the same AST walk scripts/check_import_cycles.py
# performs, at commit time (the generated pre-commit hook), in
# lamidos-preflight, and in the suite (src/lamidos/tests/
# test_import_graph.py). Widening anything below is a deliberate
# edit: the diff states why.

# Ceiling of distinct importers per module; only goes down. Seeded
# at 5 — tighter than msks's 12 — so the split-what-everyone-imports
# pressure binds early in a codebase meant to stay small.
fan_in_ceiling = 5

# Production entry points (pyproject [project.scripts] plus every
# `python -m` entry). Every module under src/lamidos/lamidos must
# be reachable from these.
entry_points = ["lamidos"]

# Re-export surfaces: modules whose re-exported names may be
# imported from elsewhere. Seeded empty; an entry must re-export
# at least one name or fails as stale.
facades = []

# Package-level cycles the DAG gate exempts. The module-level
# graph is acyclic regardless; an exemption whose pair stops
# cycling both ways fails as stale, so this list only shrinks. A
# new entry needs a shared-leaf extraction first and a reason
# here.
[exempt_pairs]

# Layer ranks: every cross-package import runs from a higher rank
# to a lower one. Rank 0 is the root package today — the emulator
# is a skeleton with a single module; new subpackages declare a
# rank before they take imports.
[ranks]
lamidos = 0

# Exact cross-package import-statement counts, per pair. A count
# that grows or shrinks fails until this file is updated in the
# same commit — re-coupling is always a deliberate edit. Seeded
# empty: a single-module package has no cross-package pairs.
[snapshot]

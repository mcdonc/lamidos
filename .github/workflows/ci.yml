# CI: the authoritative unit-test run.
#
# Everything runs inside the devenv shell built from this repo's
# devenv.nix/devenv.yaml — the same pinned nixpkgs, the same uv
# venv, as every contributor gets — so a green run here means the
# dev environment itself is healthy too. Lint gates run in
# lint.yml as their own check.
name: CI

# Markdown-only changes cannot move the gates (ruff/xenon read
# src/, the unit tests exercise code) — so an .md-only push skips
# the run instead of burning a runner.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      # Pinned release, not the moving default registry: the devenv
      # that evaluates the 2.x tasks syntax and parses -O is the one
      # moving part otherwise — an upstream break would red CI with
      # no repo change.
      - name: Install devenv.sh
        run: nix profile add github:cachix/devenv/v2.3.1

      # The CI-identical invocation (AGENTS.md): pytest -n auto with
      # coverage flags from pyproject addopts, COVERAGE_CORE=sysmon
      # pinned by conftest, fail_under = 100 branch coverage.
      - name: Unit tests
        env:
          TMPDIR: /tmp
        run: >-
          devenv --quiet -O dotenv.enable:bool false shell --
          unit-tests
